<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>varsha</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/data.js" defer></script>
  <script src="/static/rescue.js" defer></script>
  <script src="/static/mysqlrescue.js" defer></script>
  <script src="/static/bankimport.js" defer></script>
  <script src="/static/settings.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="topbar-band">
    <header class="topbar">
      <a class="brand" href="#stack" data-view="stack" aria-label="varsha home">
        <span class="brand-mark"><img src="/static/logo.png" alt=""></span>
        <span>
          <span class="brand-name">varsha</span>
          <span class="brand-tag">local dev stack</span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Sections">
        <!-- daily use: always visible -->
        <button class="nav-item" data-view="stack" title="Stack (1)">Stack</button>
        <button class="nav-item" data-view="sites" title="Sites (2)">Sites</button>
        <button class="nav-item" data-view="databases" title="Databases (3)">Databases</button>
        <button class="nav-item" data-view="mail" title="Mail (4)">Mail</button>
        <button class="nav-item" data-view="errors" title="PHP errors (5)">Errors</button>
        <button class="nav-item" data-view="logs" title="Logs (8)">Logs</button>
        <button class="nav-item nav-bank" data-view="bankimport" title="Import Banks Data: drop bankdb.sql / inventory1.sql">Import Banks Data</button>
        <!-- the rest, grouped -->
        <div class="nav-group">
          <button class="nav-item nav-parent" data-nav-menu="tools" aria-haspopup="true" aria-expanded="false"><span class="nav-parent-label">Tools</span></button>
          <div class="nav-menu" id="nav-menu-tools" role="menu" hidden>
            <button class="nav-menu-item" data-view="data" role="menuitem"><span class="nav-menu-icon">&#9638;</span><span><b>Data Browser</b><small>SQLite, Access and CSV files</small></span></button>
            <button class="nav-menu-item" data-view="rescue" role="menuitem"><span class="nav-menu-icon">&#10010;</span><span><b>MDB Rescue</b><small>recover a damaged Access .mdb</small></span></button>
            <button class="nav-menu-item" data-view="mysqlrescue" role="menuitem"><span class="nav-menu-icon">&#10010;</span><span><b>MySQL Rescue</b><small>recover a damaged data folder</small></span></button>
            <div class="nav-menu-sep"></div>
            <button class="nav-menu-item" data-view="tasks" role="menuitem" title="Tasks (6)"><span class="nav-menu-icon">&#9719;</span><span><b>Tasks</b><small>scheduled commands (cron)</small></span></button>
            <button class="nav-menu-item" data-view="share" role="menuitem" title="Share (7)"><span class="nav-menu-icon">&#8599;</span><span><b>Share</b><small>internet link and LAN</small></span></button>
          </div>
        </div>
        <div class="nav-group">
          <button class="nav-item nav-parent" data-nav-menu="system" aria-haspopup="true" aria-expanded="false"><span class="nav-parent-label">System</span></button>
          <div class="nav-menu" id="nav-menu-system" role="menu" hidden>
            <button class="nav-menu-item" data-view="system" role="menuitem" title="System (9)"><span class="nav-menu-icon">&#9881;</span><span><b>System</b><small>PHP, HTTPS, DNS, folders</small></span></button>
            <button class="nav-menu-item" data-view="doctor" role="menuitem" title="Doctor (0)"><span class="nav-menu-icon">+</span><span><b>Doctor</b><small>check the whole setup</small></span></button>
            <div class="nav-menu-sep"></div>
            <button class="nav-menu-item" data-view="settings" role="menuitem"><span class="nav-menu-icon">&#9881;</span><span><b>Settings</b><small>startup, services, control panel</small></span></button>
          </div>
        </div>
      </nav>
      <span class="topbar-spacer"></span>
      <div id="meter"></div>
      <div class="topbar-actions">
        <button class="btn btn-mint icon-btn" data-act="start-all" aria-label="Start all"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ico-fill" d="M7 4l13 8-13 8z"/></svg><span class="ico-name">Start all</span></button>
        <button class="btn icon-btn" data-act="restart-all" aria-label="Restart all running services"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span class="ico-name">Restart running services</span></button>
        <button class="btn icon-btn" data-act="stop-all" aria-label="Stop all"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="ico-fill" x="6" y="6" width="12" height="12" rx="1.5"/></svg><span class="ico-name">Stop all</span></button>
        <button class="btn btn-ink icon-btn" data-act="quit" aria-label="Quit varsha"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/></svg><span class="ico-name">Quit varsha</span></button>
      </div>
    </header>
    </div>

    <main class="main">
      <div class="offline" id="offline" hidden>Lost contact with varsha. Is it still running? Reconnecting&hellip;</div>
      <div class="page-head" id="page-head">
        <div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
        </div>
      </div>
      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <dialog class="dialog" id="dialog">
    <form method="dialog" class="dialog-body" id="dialog-form"></form>
  </dialog>
</body>
</html>
