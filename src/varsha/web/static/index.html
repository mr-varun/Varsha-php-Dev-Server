<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>varsha</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/data.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#stack" data-view="stack" aria-label="varsha home">
        <span class="brand-mark"><img src="/static/logo.png" alt=""></span>
        <span>
          <span class="brand-name">varsha</span>
          <span class="brand-tag">local dev stack</span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Sections">
        <!-- daily use: always visible -->
        <button class="nav-item" data-view="stack" title="Stack (1)">Stack</button>
        <button class="nav-item" data-view="sites" title="Sites (2)">Sites</button>
        <button class="nav-item" data-view="databases" title="Databases (3)">Databases</button>
        <button class="nav-item" data-view="mail" title="Mail (4)">Mail</button>
        <button class="nav-item" data-view="errors" title="PHP errors (5)">Errors</button>
        <button class="nav-item" data-view="logs" title="Logs (8)">Logs</button>
        <!-- the rest, grouped -->
        <div class="nav-group">
          <button class="nav-item nav-parent" data-nav-menu="tools" aria-haspopup="true" aria-expanded="false"><span class="nav-parent-label">Tools</span></button>
          <div class="nav-menu" id="nav-menu-tools" role="menu" hidden>
            <button class="nav-menu-item" data-view="data" role="menuitem"><span class="nav-menu-icon">&#9638;</span><span><b>Data</b><small>SQLite, Access and CSV files</small></span></button>
            <div class="nav-menu-sep"></div>
            <button class="nav-menu-item" data-view="tasks" role="menuitem" title="Tasks (6)"><span class="nav-menu-icon">&#9719;</span><span><b>Tasks</b><small>scheduled commands (cron)</small></span></button>
            <button class="nav-menu-item" data-view="share" role="menuitem" title="Share (7)"><span class="nav-menu-icon">&#8599;</span><span><b>Share</b><small>internet link and LAN</small></span></button>
          </div>
        </div>
        <div class="nav-group">
          <button class="nav-item nav-parent" data-nav-menu="system" aria-haspopup="true" aria-expanded="false"><span class="nav-parent-label">System</span></button>
          <div class="nav-menu" id="nav-menu-system" role="menu" hidden>
            <button class="nav-menu-item" data-view="system" role="menuitem" title="System (9)"><span class="nav-menu-icon">&#9881;</span><span><b>System</b><small>PHP, HTTPS, DNS, folders</small></span></button>
            <button class="nav-menu-item" data-view="doctor" role="menuitem" title="Doctor (0)"><span class="nav-menu-icon">+</span><span><b>Doctor</b><small>check the whole setup</small></span></button>
          </div>
        </div>
      </nav>
      <span class="topbar-spacer"></span>
      <div id="meter"></div>
      <div class="topbar-actions">
        <button class="btn btn-mint" data-act="start-all" title="Start all" aria-label="Start all">&#9654;<span class="btn-label"> Start all</span></button>
        <button class="btn" data-act="stop-all" title="Stop all" aria-label="Stop all">&#9632;<span class="btn-label"> Stop all</span></button>
        <button class="btn btn-ink" data-act="quit" title="Quit varsha" aria-label="Quit varsha">&#x23FB;</button>
      </div>
    </header>

    <main class="main">
      <div class="offline" id="offline" hidden>Lost contact with varsha. Is it still running? Reconnecting&hellip;</div>
      <div class="page-head" id="page-head">
        <div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
        </div>
      </div>
      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <dialog class="dialog" id="dialog">
    <form method="dialog" class="dialog-body" id="dialog-form"></form>
  </dialog>
</body>
</html>
